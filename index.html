<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#000000" />
<title>Walk Proto — Viewer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  background: #000;
  color: #e8ecf4;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
/* Full-bleed app root — fills the phone WebView / browser viewport */
#screen {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: #111;
}
#c {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}
#hud {
  position: absolute;
  top: max(12px, env(safe-area-inset-top, 0px));
  left: max(12px, env(safe-area-inset-left, 0px));
  right: max(12px, env(safe-area-inset-right, 0px));
  pointer-events: none;
  z-index: 3;
}
#status {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .02em;
  text-shadow: 0 1px 4px rgba(0,0,0,.8);
  opacity: .95;
}
#hint {
  margin-top: 4px;
  font-size: 11px;
  opacity: .7;
  text-shadow: 0 1px 3px rgba(0,0,0,.8);
}
#joystick {
  position: absolute;
  left: max(16px, env(safe-area-inset-left, 0px));
  bottom: max(20px, calc(12px + env(safe-area-inset-bottom, 0px)));
  width: 118px;
  height: 118px;
  border-radius: 50%;
  background: rgba(255,255,255,.08);
  border: 1.5px solid rgba(255,255,255,.18);
  z-index: 4;
  touch-action: none;
}
#stick {
  position: absolute;
  left: 50%; top: 50%;
  width: 52px; height: 52px;
  margin: -26px 0 0 -26px;
  border-radius: 50%;
  background: rgba(255,255,255,.28);
  border: 1.5px solid rgba(255,255,255,.45);
  box-shadow: 0 4px 12px rgba(0,0,0,.35);
  pointer-events: none;
}
#lookPad {
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 55%;
  z-index: 2;
  touch-action: none;
}

</style>
</head>
<body>
<div id="screen">
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="status">Loading…</div>
    <div id="hint">Stick move · drag look · NPCs roam city roads</div>
  </div>
  <div id="joystick" aria-label="Move joystick">
    <div id="stick"></div>
  </div>
  <div id="lookPad" aria-label="Look pad"></div>
</div>
<script src="./game.js"></script>
</body>
</html>
